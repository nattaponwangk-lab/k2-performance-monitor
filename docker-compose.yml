services:
  # ---- SQL Server (Monitoring DB + demo source) ----
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: k2pm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- Worker: collectors + Hangfire + alert/notify ----
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: k2pm-worker
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "Production"
      # Monitoring DB (owned by this system). SourceDb = SQL Server ที่จะ monitor (demo: ตัวเดียวกัน)
      ConnectionStrings__MonitorDb: "Server=sqlserver;Database=K2PerfMonitor;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__SourceDb:  "Server=sqlserver;Database=master;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__K2Db:      "Server=sqlserver;Database=master;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      SignalR__Enabled: "true"
      SignalR__HubUrl: "http://web:8080/hubs/monitor"
    restart: unless-stopped

  # ---- Web: Blazor dashboard + SignalR hub ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: k2pm-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__MonitorDb: "Server=sqlserver;Database=K2PerfMonitor;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__SourceDb:  "Server=sqlserver;Database=master;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__K2Db:      "Server=sqlserver;Database=master;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      # สร้าง admin คนแรก (เปลี่ยนรหัสหลัง login ครั้งแรก) + persist Data Protection keys
      Auth__InitialAdminPassword: "${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD in .env}"
      DataProtection__KeyPath: "/app/keys"
    volumes:
      - dp-keys:/app/keys
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mssql-data:
  dp-keys:

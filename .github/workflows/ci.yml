name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore K2PerformanceMonitor.sln

      - name: Build
        run: dotnet build K2PerformanceMonitor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test K2PerformanceMonitor.sln --configuration Release --no-build --verbosity normal

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Str0ng_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Str0ng_Passw0rd! -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    env:
      # ให้ integration tests รันจริงกับ SQL Server service (มิฉะนั้นจะ skip แบบ graceful)
      MONITOR_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Ci_Str0ng_Passw0rd!;TrustServerCertificate=True;Connect Timeout=30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore K2PerformanceMonitor.sln

      - name: Build
        run: dotnet build K2PerformanceMonitor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test K2PerformanceMonitor.sln --configuration Release --no-build --verbosity normal
